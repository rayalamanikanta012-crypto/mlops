<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ app_name }} - Email Spam Detector</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <main class="card">
    <h1>{{ app_name }}</h1>
    <p class="subtitle">Paste an email and check if it's spam.</p>

    <label for="subject">Subject</label>
    <input id="subject" type="text" placeholder="Email subject (optional)">

    <label for="body">Body</label>
    <textarea id="body" rows="8" placeholder="Paste the email content here..."></textarea>

    <button id="check-btn">Check email</button>

    <div id="result" class="result hidden" role="status"></div>
  </main>

  <script>
    window.API_URL = {{ api_url | tojson }};
    window.API_PORT = {{ api_port | tojson }};
  </script>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
